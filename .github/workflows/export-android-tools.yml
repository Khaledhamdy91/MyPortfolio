name: Export Android build tools
on:
  push:
    branches:
      - chatgpt-apk-tools
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare tools
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          curl -L --fail -o out/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          BT=$(ls -1 "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          PL=$(find "$ANDROID_SDK_ROOT/platforms" -maxdepth 1 -type d -name 'android-[0-9]*' | sed 's#.*/android-##' | grep -E '^[0-9]+$' | sort -n | tail -1)
          cp "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" out/
          cp "$ANDROID_SDK_ROOT/build-tools/$BT/lib/apksigner.jar" out/
          cp "$ANDROID_SDK_ROOT/build-tools/$BT/zipalign" out/
          cp "$ANDROID_SDK_ROOT/build-tools/$BT/aapt2" out/
          cp "$ANDROID_SDK_ROOT/build-tools/$BT/lib/d8.jar" out/
          cp "$ANDROID_SDK_ROOT/platforms/android-$PL/android.jar" out/
          chmod +x out/apksigner out/zipalign out/aapt2
      - uses: actions/upload-artifact@v4
        with:
          name: android-tools
          path: out/
          retention-days: 1
